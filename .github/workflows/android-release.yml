name: KP VPN Android Release
on:
  workflow_dispatch:
  push:
    branches: [main, kp-vpn-catalog]
    paths: ['KP-VPN/**', '.github/workflows/android-release.yml']
permissions:
  contents: read
concurrency:
  group: kp-vpn-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: KP-VPN
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK and Myanmar font
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          bash scripts/prepare-font.sh
      - name: App behavior and browser checks
        run: |
          node --test tests/*.cjs
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/browser-check.js
      - uses: actions/upload-artifact@v7
        with:
          name: KP-VPN-0.2.0-UI
          path: KP-VPN/build/ui/
      - name: Build Android APK, lint and native tests
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Create download metadata from the actual APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/KP-VPN-0.2.0.apk
          python - <<'PY'
          import hashlib,json,pathlib,datetime
          out=pathlib.Path('release');apk=out/'KP-VPN-0.2.0.apk'
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest={'version':'0.2.0','version_code':2,'apk_url':'https://github.com/khantpyae332003/kp-ai-vpn/releases/download/v0.2.0/KP-VPN-0.2.0.apk','sha256':digest,'size_bytes':apk.stat().st_size,'published_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'signing_mode':'debug_preview','min_android':8}
          (out/'app-release.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (out/'SHA256SUMS').write_text(digest+'  KP-VPN-0.2.0.apk\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: KP-VPN-0.2.0-APK
          path: KP-VPN/release/
          retention-days: 30
      - name: Publish immutable preview release and website download metadata
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            mkdir -p release-existing
            gh release download v0.2.0 --pattern KP-VPN-0.2.0.apk --pattern app-release.json --dir release-existing
            python - <<'PY'
          import pathlib,json,hashlib
          d=pathlib.Path('release-existing');m=json.loads((d/'app-release.json').read_text());b=(d/'KP-VPN-0.2.0.apk').read_bytes()
          assert m['version']=='0.2.0' and hashlib.sha256(b).hexdigest()==m['sha256'] and len(b)==m['size_bytes']
          PY
            cp release-existing/app-release.json ../assets/app-release.json
          else
            cat > release/NOTES.md <<'NOTES'
          KP VPN 0.2.0 Android preview: modern network shield UI, TH/MM/Global profile organization, local WireGuard imports and website access.

          This APK uses a fresh Android debug signing certificate. Updating an older installation in place is not guaranteed. Save original configuration files before changing installations. No actual SIM or package-free data compatibility is certified.
          NOTES
            gh release create v0.2.0 release/KP-VPN-0.2.0.apk release/app-release.json release/SHA256SUMS --title 'KP VPN 0.2.0 Preview' --notes-file release/NOTES.md --target "$GITHUB_SHA" --prerelease
            cp release/app-release.json ../assets/app-release.json
          fi
          cd ..
          git config user.name 'KP VPN Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app-release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified APK download metadata'
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=true; break; fi
              sleep 2
            done
            test "$pushed" = true
          fi
      - name: Deploy the APK download button explicitly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run catalog.yml --ref main
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: KP-VPN-0.2.0-build-reports
          path: KP-VPN/app/build/reports/

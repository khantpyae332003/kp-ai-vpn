name: KP VPN Website Watch
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [KP VPN Catalog Agents, KP VPN Android Release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kp-vpn-watch
  cancel-in-progress: true
jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Monitor · ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: [health, security, integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Read-only public website monitor
        run: python -m agents.site_watch --check '${{ matrix.check }}'
      - uses: actions/setup-node@v7
        if: matrix.check == 'integrity'
        with:
          node-version: '22'
      - name: Live mobile and desktop browser monitor
        if: matrix.check == 'integrity'
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/live-check.cjs
      - uses: actions/upload-artifact@v7
        if: always() && matrix.check == 'integrity'
        with:
          name: live-website-checks
          path: watch-qa/
          retention-days: 7

name: Build KP VPN APK
on:
  push:
    branches: [kp-vpn-new]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: KP-VPN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: UI behavior tests
        run: node --test tests/*.cjs
      - name: Build, lint and Android unit tests
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KP-VPN-0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KP-VPN-APK
          path: KP-VPN/KP-VPN-0.1.0-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: KP-VPN-build-reports
          path: KP-VPN/app/build/reports/

name: BrowserStack Connection Check

on:
  workflow_dispatch:
  push:
    branches: [codex/browserstack-connection]
    paths: [.github/workflows/browserstack-connection.yml]

permissions:
  contents: write

concurrency:
  group: browserstack-connection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check BrowserStack credentials and Android device catalog
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          names = ('BROWSERSTACK_USERNAME', 'BROWSERSTACK_ACCESS_KEY')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              print('::error::Missing repository secrets: ' + ', '.join(missing))
              sys.exit(1)
          pair = ':'.join(os.environ[name] for name in names).encode()
          authorization = 'Basic ' + base64.b64encode(pair).decode()

          def read_api(path):
              request = urllib.request.Request(
                  'https://api-cloud.browserstack.com' + path,
                  headers={'Authorization': authorization, 'Accept': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print('::error::BrowserStack API returned HTTP ' + str(error.code)
                        + '. Check credentials and App Automate access.')
              except (urllib.error.URLError, TimeoutError, OSError):
                  print('::error::BrowserStack network request failed.')
              except ValueError:
                  print('::error::BrowserStack returned an unexpected response.')
              sys.exit(1)

          plan = read_api('/app-automate/plan.json')
          if not isinstance(plan, dict):
              print('::error::Unexpected App Automate account response.')
              sys.exit(1)
          devices = read_api('/app-automate/devices.json')
          if not isinstance(devices, list):
              print('::error::Unexpected device catalog response.')
              sys.exit(1)
          android = [device for device in devices if isinstance(device, dict)
                     and str(device.get('os', '')).lower() == 'android']
          if not android:
              print('::error::No Android entries found in the device catalog.')
              sys.exit(1)
          text = ('BrowserStack account API check passed.\n'
                  + 'Android catalog entries: ' + str(len(android)) + '\n'
                  + 'Connection check only: no device session or app test has run.\n'
                  + 'Kali installation, visible desktop, root/sudo and reopen checks remain pending.\n')
          safe_plan = {key: value for key, value in plan.items()
                       if key in {'automate_plan', 'app_automate_plan', 'parallel_sessions_running',
                                  'parallel_sessions_max_allowed', 'team_parallel_sessions_max_allowed',
                                  'queued_sessions', 'queued_sessions_max_allowed', 'remaining_minutes',
                                  'minutes_remaining', 'trial_minutes_remaining', 'used_minutes'}
                       and isinstance(value, (str, int, float, bool))}
          candidates = [{key: device.get(key) for key in ('device', 'os_version', 'real_mobile')}
                        for device in android if 'Samsung Galaxy S2' in str(device.get('device', ''))]
          text += '\nAccount plan/quota fields:\n```json\n' + json.dumps(safe_plan, indent=2) + '\n```\n'
          text += '\nSamsung device candidates:\n```json\n' + json.dumps(candidates[:20], indent=2) + '\n```\n'
          from pathlib import Path
          report = {'account_api_check': 'passed', 'device_session_started': False,
                    'plan_field_names': sorted(plan), 'plan': safe_plan,
                    'android_catalog_entries': len(android), 'samsung_candidates': candidates[:20]}
          Path('.ci').mkdir(exist_ok=True)
          Path('.ci/browserstack-preflight.json').write_text(json.dumps(report, indent=2) + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PY
      - name: Save non-secret connection report on this test branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/browserstack-connection'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/browserstack-preflight.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record BrowserStack connection and device preflight'
            git push origin HEAD:codex/browserstack-connection
          fi

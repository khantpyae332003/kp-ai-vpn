name: HTTPS Probe Diagnostics
on:
  push:
    branches: [kp-vpn-catalog]
    paths: ['.github/workflows/https-check.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Compare fixed and DNS-resolved HTTPS targets
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          for host in ['www.cloudflare.com','example.com','www.gstatic.com']:
              print(host, sorted({a[4][0] for a in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)}))
          PY
          curl -4 --noproxy '*' --max-time 12 --silent --show-error --output /dev/null --write-out 'fixed_cf http=%{http_code} tls=%{ssl_verify_result}\n' --resolve www.cloudflare.com:443:104.16.132.229 https://www.cloudflare.com/cdn-cgi/trace || true
          curl -4 --noproxy '*' --max-time 12 --silent --show-error --output /dev/null --write-out 'dns_cf http=%{http_code} tls=%{ssl_verify_result}\n' https://www.cloudflare.com/cdn-cgi/trace || true
          curl -4 --noproxy '*' --max-time 12 --silent --show-error --output /dev/null --write-out 'dns_example http=%{http_code} tls=%{ssl_verify_result}\n' https://example.com/ || true
          curl -4 --noproxy '*' --max-time 12 --silent --show-error --output /dev/null --write-out 'dns_gstatic http=%{http_code} tls=%{ssl_verify_result}\n' https://www.gstatic.com/generate_204 || true

name: KP VPN Catalog Agents
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main, kp-vpn-catalog]
    paths: ['agents/**', 'data/**', 'assets/**', 'index.html', 'tests/**', '.github/workflows/catalog.yml']
permissions:
  contents: read
concurrency:
  group: kp-vpn-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finder:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run policy tests
        run: python -m unittest discover -s tests -v
      - name: Agent 1 — discover sources and collect manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m agents.finder --discover
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-candidates
          path: work/
          retention-days: 1
  verifier:
    needs: finder
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: catalog-candidates
          path: work/
      - name: Install VPN probe tools and Myanmar font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools iproute2 curl fonts-noto-core
      - name: Agent 2 — independently verify, test and publish catalog
        run: sudo "$(command -v python)" -m agents.verifier
      - name: Run policy tests again
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser UI checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/browser-check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-ui-checks
          path: qa/
          retention-days: 7
      - name: Commit catalog only when changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'KP VPN Catalog Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified VPN catalog [skip ci]'
            git push origin HEAD:main
          fi
      - name: Stage existing GitHub Pages site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r assets catalog site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verifier
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish updated website
        id: deployment
        uses: actions/deploy-pages@v4

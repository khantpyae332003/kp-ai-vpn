name: KP VPN Catalog Agents
on:
  schedule:
    # All 24 hours, every 30 minutes (UTC); scheduled jobs can be delayed.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      ai_refresh:
        description: 'Request a fresh bounded AI review (uses API quota)'
        type: boolean
        default: false
  push:
    branches: [main, kp-vpn-catalog]
    paths: ['agents/**', 'data/**', 'assets/**', 'index.html', 'tests/**', '.github/workflows/catalog.yml']
permissions:
  contents: read
concurrency:
  group: kp-vpn-catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  finder:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run policy tests
        run: python -m unittest discover -s tests -v
      - name: Agent 1 — discover sources and collect manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m agents.finder --discover
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-candidates
          path: work/
          retention-days: 1
  verifier:
    needs: finder
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: catalog-candidates
          path: work/
      - name: Install VPN probe tools and Myanmar font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools iproute2 curl fonts-noto-core
      - name: Agent 2 — independently verify, test and publish catalog
        run: sudo "$(command -v python)" -m agents.verifier
      - name: Roles 3-8 — classify, publish, daily learning and bounded monitors
        run: python -m agents.pipeline --out catalog
      - name: Daily AI review of eight roles (metadata only)
        if: github.ref == 'refs/heads/main'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          FORCE_AI_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_refresh && '1' || '0' }}
        run: python -m agents.ai_review
      - name: Run policy tests again
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Config builder and checker tests
        run: node --test tests/*.test.cjs
      - name: Browser UI checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/browser-check.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-ui-checks
          path: qa/
          retention-days: 7
      - name: Commit catalog only when changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'KP VPN Catalog Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified VPN catalog [skip ci]'
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=true; break; fi
              sleep 2
            done
            test "$pushed" = true
          fi
      - name: Stage existing GitHub Pages site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r assets catalog site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verifier
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish updated website
        id: deployment
        uses: actions/deploy-pages@v5
